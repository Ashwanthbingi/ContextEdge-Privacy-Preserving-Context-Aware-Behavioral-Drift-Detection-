[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "contextedge"
version = "1.0.0"
description = "Local context-aware behavioural anomaly and drift research application"
requires-python = ">=3.11,<3.13"
dependencies = [
  "psutil==7.1.3", "numpy==2.2.6", "pandas==2.3.3",
  "scikit-learn==1.7.2", "torch==2.9.1", "onnx==1.19.1",
  "onnxruntime==1.23.2", "river==0.22.0", "streamlit==1.51.0",
  "joblib==1.5.2"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[project.scripts]
contextedge = "contextedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:You are using the legacy TorchScript-based ONNX export:DeprecationWarning", "ignore:The feature will be removed:DeprecationWarning", "ignore:Exporting a model to ONNX:UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

